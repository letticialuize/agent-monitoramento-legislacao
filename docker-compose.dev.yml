# Dependências locais da Api.Agente (somente desenvolvimento).
# Credenciais abaixo são apenas para ambiente local.
# Portas fora do padrão (55432, 57017) para não colidir com bancos de outros projetos na máquina.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agente
      POSTGRES_USER: agente
      POSTGRES_PASSWORD: agente_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    ports:
      - "57017:27017"
    volumes:
      - mongo-data:/data/db

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "2525:25"
      - "5080:80"

volumes:
  postgres-data:
  mongo-data:
